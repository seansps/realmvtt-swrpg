<script>
  // Read from the just-patched `record` the onchange hands us, NOT api.getValue:
  // getValue resolves the open window's store copy, which is only refreshed by
  // the websocket watch and can still hold the pre-edit value here, leaving the
  // *Remaining field (and the combat tracker bars) one edit behind.
  function recalcVehicleRemaining(current, threshold) {
    const vehicleDataPath = getNearestParentDataPath(dataPath);
    const prefix = vehicleDataPath ? `${vehicleDataPath}.` : "";
    const readInt = (field) =>
      parseInt(api.getValueOnRecord(record, `${prefix}data.${field}`) || "0", 10) || 0;
    const remaining = Math.max(readInt(threshold) - readInt(current), 0);
    api.setValue(`${prefix}data.${current}Remaining`, remaining);
  }

  function onChangeWounds() {
    recalcVehicleRemaining("wounds", "woundThreshold");
  }

  function onChangeStrain() {
    recalcVehicleRemaining("strain", "strainThreshold");
  }
</script>
