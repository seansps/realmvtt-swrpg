<script>
  function getWeaponAttachmentFilters() {
    // Attached weapons are not carried, so we need to cancel that filter out
    const filters = [
      {
        field: "carried",
        operation: "not_equals",
        value: "carried",
        isOr: true,
      },
    ];
    return filters;
  }

  function onAttachmentLoad() {
    if (!dataPath) {
      return;
    }
    const attachmentDataPath = dataPath.replace(".data.attachmentsIcon", "");
    const attachment = api.getValue(attachmentDataPath);
    const valuesToSet = {};
    const isWeapon = attachment.data?.attachmentType === "weapon";
    const propsShown = attachment.fields?.attachmentProperties?.hidden === false;
    const listShown = attachment.fields?.weaponAttached?.hidden === false;

    if (!isWeapon) {
      if (!propsShown) {
        valuesToSet[
          `${attachmentDataPath}.fields.attachmentProperties.hidden`
        ] = false;
        // Check if active is undefined and if so default to true
        if (
          attachment.data?.active === undefined ||
          attachment.data?.active === null
        ) {
          valuesToSet[`${attachmentDataPath}.data.active`] = true;
        }
      }
      // Non-weapon attachments have no weapon list, so keep it collapsed
      // instead of rendering an empty list placeholder
      if (listShown) {
        valuesToSet[`${attachmentDataPath}.fields.weaponAttached.hidden`] = true;
      }
    } else if (!listShown) {
      valuesToSet[`${attachmentDataPath}.fields.weaponAttached.hidden`] = false;
    }

    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet);
    }
  }
</script>

<div
  style="
    display: flex;
    flex-direction: row;
    align-items: center;
    width: 100%;
    gap: 4px;
  "
>
  <iconbutton
    variant="outline"
    field="attachmentsIcon"
    color="default"
    onload="onAttachmentLoad()"
    options='[{"icon": "IconCornerDownRight", "label": "Attachments", "value": "asttachments"}]'
  ></iconbutton>

  <box field="attachmentProperties" hidden="true" width="100%">
    <div
      style="
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 4px;
        width: 100%;
      "
    >
      <checkbox field="active" label="Active?" textalign="right"></checkbox>
      <div style="flex: 1 1 auto; min-width: 0">
        <namefield
          field="namefield"
          variant="standard"
          width="100%"
          placeholder="Attachment Name..."
        ></namefield>
      </div>
    </div>
  </box>

  <list
    field="weaponAttached"
    listtype="attack_list"
    variant="standard"
    hidden="true"
    emptylisttext="No Weapon Attached"
    getfilters="return getWeaponAttachmentFilters();"
  ></list>
</div>
